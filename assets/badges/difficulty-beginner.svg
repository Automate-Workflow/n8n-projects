<svg xmlns="http://www.w3.org/2000/svg" width="132" height="20" viewBox="0 0 132 20" role="img" aria-labelledby="badge-beg-title badge-beg-desc">
  <title id="badge-beg-title">Difficulty: Beginner</title>
  <desc id="badge-beg-desc">Shield badge showing Beginner difficulty in light tint red.</desc>
  <clipPath id="clip-beg">
    <rect width="132" height="20" rx="4" />
