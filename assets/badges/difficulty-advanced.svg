  </g>
  <g font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">
    <text x="32" y="14" fill="#FFFFFF">difficulty</text>
    <text x="98" y="14" fill="#FFFFFF" font-weight="700">advanced</text>
  </g>
</svg>
