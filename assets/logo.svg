<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Automate Workflow n8n-projects Logo</title>
  <desc id="logo-desc">Square red emblem showing three connected automation workflow nodes.</desc>
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#logo-bg)" stroke="#FEE2E2" stroke-opacity="0.35" stroke-width="2" />

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 64 C 58 64, 60 38, 86 38" stroke="#FEE2E2" stroke-width="5.5" />
    <path d="M 38 64 C 58 64, 60 90, 86 90" stroke="#FFFFFF" stroke-width="5.5" />
    <line x1="88" y1="50" x2="88" y2="78" stroke="#FEE2E2" stroke-opacity="0.7" stroke-width="3.5" stroke-dasharray="4 4" />
  </g>

  <circle cx="36" cy="64" r="14" fill="#FFFFFF" />
  <circle cx="36" cy="64" r="5.5" fill="#B91C1C" />

  <circle cx="88" cy="38" r="13" fill="#FEE2E2" />
  <circle cx="88" cy="38" r="5" fill="#7F1D1D" />

  <circle cx="88" cy="90" r="13" fill="#FFFFFF" />
  <circle cx="88" cy="90" r="5" fill="#DC2626" />
</svg>
