name: Validate CSV and Generated Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CSV and Check Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Validate dataset schema and URLs
        run: python scripts/validate_csv.py --strict

      - name: Regenerate documentation and dynamic badges
        run: python scripts/build_readme.py

      - name: Fail if generated files drifted from CSV
        run: |
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Generated files are out of sync with data/n8n_list.csv. Run 'python scripts/build_readme.py' and commit the changes."
            git status --short
            exit 1
          fi
