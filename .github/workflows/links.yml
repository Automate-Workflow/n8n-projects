name: Weekly Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Verify External Project URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Run link checker with retries and timeout
        run: |
          python scripts/check_links.py \
            --timeout 15 \
            --retries 3 \
            --workers 6 \
            --output reports/link-check-report.md \
            --json-output reports/link-check-report.json

      - name: Upload link check report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: link-check-report
          path: reports/
          retention-days: 30
